# Reference run settings for `src/cyclenet/eval/deeplab_fd.py`.
# The script itself is configured directly in `main()`, but this file can be
# used to track which checkpoint, real set, and cache directory were used.

deeplab_ckpt_path: /path/to/deeplab.ckpt
feature_layer: prelogits
batch_size: 32

real_dir: /path/to/real_images
reference_cache_dir: /path/to/reference_cache/deeplab

step_dir: /path/to/translated_outputs/step-30000
translated_embed_filename: deeplab_translated_embed.npy
csv_out_path: /path/to/translated_outputs/step-30000/deeplab_fd_stats.csv
